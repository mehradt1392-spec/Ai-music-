<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مدیریت | AI موزیک</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background:
                radial-gradient(circle at 20% 10%, rgba(130,70,255,.18), transparent 30%),
                radial-gradient(circle at 80% 90%, rgba(0,180,255,.10), transparent 30%),
                #07070c;
            color: white;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        header p {
            color: #888;
            line-height: 2;
        }

        .panel {
            background: rgba(255,255,255,.055);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 25px;
            padding: 30px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 70px rgba(0,0,0,.35);
        }

        .panel h2 {
            margin-bottom: 25px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #bbb;
            font-size: 14px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,.1);
            background: rgba(255,255,255,.06);
            color: white;
            outline: none;
            font-family: inherit;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        select option {
            background: #15151d;
        }

        input[type="file"] {
            padding: 12px;
        }

        .button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(90deg,#7040b5,#9c68e8);
            color: white;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            transition: .3s;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(130,80,200,.25);
        }

        .button:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 14px;
            background: rgba(255,255,255,.04);
            color: #aaa;
            line-height: 2;
            display: none;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .status.show {
            display: block;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #aaa;
            text-decoration: none;
        }

        .back:hover {
            color: white;
        }

        @media(max-width:600px) {
            body {
                padding: 20px 15px;
            }

            .panel {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <div class="logo">
            🎧 AI موزیک
        </div>

        <p>
            پنل مدیریت و افزودن موسیقی
        </p>
    </header>


    <div class="panel">

        <h2>
            ➕ افزودن آهنگ جدید
        </h2>


        <div class="field">
            <label>نام آهنگ</label>

            <input
                type="text"
                id="title"
                placeholder="مثلاً: شب‌های تهران"
            >
        </div>


        <div class="field">
            <label>توضیحات</label>

            <textarea
                id="description"
                placeholder="توضیح کوتاهی دربارهٔ آهنگ..."
            ></textarea>
        </div>


        <div class="field">
            <label>سبک موسیقی</label>

            <select id="genre">
                <option value="پاپ">پاپ</option>
                <option value="جاز">جاز</option>
                <option value="راک">راک</option>
                <option value="الکترونیک">الکترونیک</option>
                <option value="سینمایی">سینمایی</option>
                <option value="آرام">آرام</option>
                <option value="سایر">سایر</option>
            </select>
        </div>


        <div class="field">
            <label>حال‌وهوای آهنگ</label>

            <input
                type="text"
                id="mood"
                placeholder="مثلاً: آرام، غمگین، حماسی..."
            >
        </div>


        <div class="field">
            <label>فایل آهنگ</label>

            <input
                type="file"
                id="musicFile"
                accept=".mp3,audio/*"
            >
        </div>


        <div class="field">
            <label>ایموجی کاور</label>

            <input
                type="text"
                id="cover"
                value="🎵"
                maxlength="2"
            >
        </div>


        <button
            class="button"
            id="uploadButton"
            onclick="uploadSong()"
        >
            🚀 آپلود آهنگ
        </button>


        <div
            class="status"
            id="status"
        ></div>

    </div>


    <a
        class="back"
        href="index.html"
    >
        ← بازگشت به سایت
    </a>

</div>


<script>

    const SUPABASE_URL =
        "https://ofrzopzcbnzkfqekxids.supabase.co";


    /*
       Publishable Key خودت را اینجا قرار بده.
       باید با sb_publishable_ شروع شود.
    */

    const SUPABASE_KEY =
        "sb_publishable_NumgnX9XPedv0M4En1Em0g_GAWPN2gZ";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    function showStatus(message) {

        const status =
            document.getElementById("status");

        status.textContent = message;

        status.classList.add("show");
    }


    async function uploadSong() {

        const title =
            document
            .getElementById("title")
            .value
            .trim();


        const description =
            document
            .getElementById("description")
            .value
            .trim();


        const genre =
            document
            .getElementById("genre")
            .value;


        const mood =
            document
            .getElementById("mood")
            .value
            .trim();


        const cover =
            document
            .getElementById("cover")
            .value
            .trim();


        const fileInput =
            document.getElementById("musicFile");


        const file =
            fileInput.files[0];


        const button =
            document.getElementById("uploadButton");


        if (!title) {

            showStatus(
                "❌ نام آهنگ را وارد کنید."
            );

            return;
        }


        if (!file) {

            showStatus(
                "❌ فایل آهنگ را انتخاب کنید."
            );

            return;
        }


        const fileName =
            file.name.toLowerCase();


        const isMP3 =
            fileName.endsWith(".mp3");


        if (!isMP3) {

            showStatus(
                "❌ این فایل MP3 نیست.\n\n" +
                "لطفاً یک فایل با پسوند .mp3 انتخاب کنید."
            );

            return;
        }


        if (
            file.size === 0
        ) {

            showStatus(
                "❌ فایل خالی است."
            );

            return;
        }


        if (
            file.size >
            50 * 1024 * 1024
        ) {

            showStatus(
                "❌ حجم فایل بیشتر از ۵۰ مگابایت است."
            );

            return;
        }


        button.disabled = true;

        button.textContent =
            "⏳ در حال آپلود...";


        try {

            const extension =
                "mp3";


            const safeName =
                Date.now() +
                "-" +
                Math.random()
                .toString(36)
                .substring(2, 9) +
                "." +
                extension;


            showStatus(
                "☁️ در حال ارسال فایل..."
            );


            const result =
                await supabaseClient
                .storage
                .from("music")
                .upload(
                    safeName,
                    file,
                    {
                        contentType: "audio/mpeg",
                        cacheControl: "3600",
                        upsert: false
                    }
                );


            if (result.error) {

                throw result.error;

            }


            const publicResult =
                supabaseClient
                .storage
                .from("music")
                .getPublicUrl(
                    safeName
                );


            const publicUrl =
                publicResult
                .data
                .publicUrl;


            showStatus(
                "✅ آپلود با موفقیت انجام شد!\n\n" +
                "🎵 نام: " + title +
                "\n🎼 سبک: " + genre +
                "\n🌙 حال‌وهوا: " + mood +
                "\n\n🔗 آدرس فایل:\n" +
                publicUrl
            );


            button.textContent =
                "✅ آپلود شد";


        } catch (error) {

            console.error(
                "Supabase Upload Error:",
                error
            );


            showStatus(
                "❌ آپلود انجام نشد.\n\n" +
                "خطا:\n" +
                error.message
            );


            button.disabled = false;

            button.textContent =
                "🚀 آپلود آهنگ";
        }

    }

</script>

</body>

</html>
